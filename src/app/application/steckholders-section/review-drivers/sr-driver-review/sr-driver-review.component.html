<div class="mb-4">
    <button (click)="back()" class="flex items-center gap-3 underline dark:text-textDark">
        <i class="fa-solid fa-arrow-left-long"></i> Back
    </button>
</div>

<div class="w-full bg-transparent overflow-hidden">
    <!-- Header -->
    <div
        class="flex flex-row justify-between items-center mb-6 p-6 bg-white dark:bg-tileBlack rounded-lg shadow-md gap-10 dark:text-textDark">
        <div class="flex flex-row gap-x-10">
            <div class="flex flex-col">
                <span class="text-[#7E7E7E] dark:text-[#C8C8C8]">Driver Name :</span>
                <span class="dark:text-[#FFFFFF]">{{ driverName }}</span>
            </div>
            <div class="flex flex-col">
                <span class="text-[#7E7E7E] dark:text-[#C8C8C8]">Submitted At :</span>
                <span class="dark:text-[#FFFFFF]">
                    {{ submittedAt | date: 'h:mm a, d' }}<sup>{{ getOrdinal(submittedAt) }}</sup>{{ submittedAt | date:
                    ' MMMM y' }}
                </span>
            </div>
        </div>

        <div class="flex gap-4">
            <button [style]="'box-shadow: 1px 1px 4px 0px rgba(0, 0, 0, 0.25)'"
                class="px-5 py-2 bg-[#3980C0] text-white font-medium rounded-lg hover:bg-[#306797] transition-colors duration-200 shadow-lg"
                (click)="openApprovePopUp()">
                Approve
            </button>
            <button [style]="'box-shadow: 1px 1px 4px 0px rgba(0, 0, 0, 0.25)'"
                class="px-7 py-2 bg-[#C40D0D] text-white font-medium rounded-lg hover:bg-[#980808] transition-colors duration-200 shadow-lg"
                (click)="openRejectPopUp()">
                Reject
            </button>
        </div>
    </div>

    <!-- Tabs + content -->
    <div class="relative pt-5 pb-5 w-full bg-white dark:bg-tileBlack shadow-lg rounded-lg overflow-hidden">
        <div
            class="flex whitespace-nowrap space-x-4 pb-4 pr-6 pl-6 border-b border-gray-200 overflow-x-auto scroll-smooth custom-scrollbar">
            <button *ngFor="let tab of tabs" (click)="selectTab(tab.key)" [ngClass]="
          activeTab === tab.key
            ? 'border border-[#415CFF] text-[#415CFF]'
            : 'border border-gray-300 text-textLight dark:text-textDark'
        " class="h-10 px-5 flex shrink-0 items-center justify-center rounded-full gap-2 transition-all">
                <i *ngIf="activeTab === tab.key" class="fa fa-check"></i>
                {{ tab.label }}
            </button>
        </div>

        <div class="p-6 min-h-[300px]">
            <div *ngIf="activeTab === 'Personal'">
                <app-driver-personal-info-tab [personalObj]="driverData.Personal"></app-driver-personal-info-tab>
            </div>
            <div *ngIf="activeTab === 'ResidentialBank'">
                <app-driver-residential-bank-info
                    [residentialBankObj]="driverData.ResidentialBank"></app-driver-residential-bank-info>
            </div>
            <div *ngIf="activeTab === 'LicenseInsurance'">
                <app-driver-license-insurance-info
                    [licenseInsuranceObj]="driverData.LicenseInsurance"></app-driver-license-insurance-info>
            </div>
            <div *ngIf="activeTab === 'Vehicle'">
                <app-driver-vehicale-info [vehicleObj]="driverData.Vehicle"></app-driver-vehicale-info>
            </div>
        </div>

        <!-- Pagination -->
        <div class="border-t border-gray-200 pt-6 flex items-center justify-center gap-6 dark:text-textDark">
            <button (click)="goToPreviousTab()" [disabled]="getCurrentTabIndex() === 0"
                class="w-10 h-10 rounded-md flex items-center justify-center text-white transition-colors"
                [ngClass]="getCurrentTabIndex() === 0 ? 'bg-[#A9AFC3] cursor-not-allowed' : 'bg-[#3980C0] hover:bg-[#306797]'">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <span>Page [ <b>{{ getCurrentTabIndex() + 1 }}</b> / {{ tabs.length }} ]</span>

            <button (click)="goToNextTab()" [disabled]="getCurrentTabIndex() === tabs.length - 1"
                class="w-10 h-10 rounded-md flex items-center justify-center text-white transition-colors"
                [ngClass]="getCurrentTabIndex() === tabs.length - 1 ? 'bg-[#A9AFC3] cursor-not-allowed' : 'bg-[#3980C0] hover:bg-[#306797]'">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
