<button class="mb-5 ml-10 text-textLight dark:text-textDark" (click)="goBack()">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</button>
<div class="flex justify-center items-center pb-52">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 lg:gap-16">
        <div>
            <div class="relative flex justify-center cursor-pointer">
                <div class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                    (click)="togglePopupDriverCategories()">
                    <div class="flex items-center">
                        <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                            <i class="fa-solid fa-people-group" style="color: #4a90e2"></i>
                        </div>
                        <span class="ml-3">Driver Categories</span>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
                </div>
                <div class="mt-2 rounded-lg shadow-[0_3px_10px_rgb(0,0,0,0.2)] bg-white w-[310px] absolute top-full left-0 dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500 z-50"
                    *ngIf="popupDriverCategories">
                    <div
                        class="flex rounded-t-lg align-middle items-center dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer">
                        Create Category
                    </div>
                    <div
                        class="flex rounded-b-lg align-middle items-center dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer"
                        (click)="ViewDriverCategories()"
                        >
                        View Categories
                    </div>
                </div>
            </div>
        </div>
        <div>
            <div class="relative flex justify-center cursor-pointer">
                <div class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                    (click)="togglePopupCODTransactions()">
                    <div class="flex items-center">
                        <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                            <i class="fa-solid fa-money-bills" style="color: #4a90e2"></i>
                        </div>
                        <span class="ml-3">COD Transactions</span>
                    </div>
                    <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
                </div>
                <div class="mt-2 rounded-lg shadow-[0_3px_10px_rgb(0,0,0,0.2)] bg-white w-[310px] absolute top-full left-0 dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500 z-50"
                    *ngIf="popupCODTransactions">
                    <div
                        class="flex rounded-lg align-middle items-center gap-2 dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer justify-between">
                        View Transactions
                        <span
                            class="flex items-center justify-center bg-[#4B4B4B] text-[#FFFFFF] text-xs font-semibold rounded-full w-6 h-6">
                            01
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
