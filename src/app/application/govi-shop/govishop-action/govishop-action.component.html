<div class="flex justify-center items-center pb-52">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 lg:gap-16">
        <div *ngIf="
                permissionService.hasPermission('View All Govi Shops') ||
                tokenService.getUserDetails().role === '1'
            "
             class="flex justify-center cursor-pointer">
            <div 
            *ngIf="
                permissionService.hasPermission('View All Govi Shops') ||
                tokenService.getUserDetails().role === '1'
            "
            class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                (click)="navigateToShops()">
                <div class="flex items-center">
                    <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                        <i class="fa-solid fa-shop" style="color: #4a90e2"></i>
                    </div>
                    <span class="ml-3">All Shops</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
            </div>
        </div>

        <div class="flex justify-center cursor-pointer">
            <div 
            *ngIf="
                permissionService.hasPermission('View All Branches') ||
                tokenService.getUserDetails().role === '1'
            "
            class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                (click)="navPath('/govi-shop/action/all-branches')">
                <div class="flex items-center">
                    <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                        <i class="fa-solid fa-coins" style="color: #4a90e2"></i>
                    </div>
                    <span class="ml-3">All Branches</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
            </div>
        </div>

        <div class="flex justify-center cursor-pointer">
            <div 
            *ngIf="
                permissionService.hasPermission('View All Shop Requests') ||
                tokenService.getUserDetails().role === '1'
            "
            class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                (click)="navigateToShopRequests()">
                <div class="flex items-center">
                    <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                        <i class="fa-solid fa-hand-point-up" style="color: #4a90e2"></i>
                    </div>
                    <span class="ml-3">Shop Requests</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
            </div>
        </div>

        <div class="flex justify-center cursor-pointer">
            <div 
            *ngIf="
                permissionService.hasPermission('View All Deleted Suppliers') ||
                tokenService.getUserDetails().role === '1'
            "
            class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                (click)="navigateToDeletedSuppliers()">
                <div class="flex items-center">
                    <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                        <i class="fa-solid fa-users-slash" style="color: #4a90e2"></i>
                    </div>
                    <span class="ml-3">Deleted Suppliers</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
            </div>
        </div>

        <div class="flex justify-center cursor-pointer">
            <div 
            *ngIf="
                permissionService.hasPermission('View All Deleted Shops') ||
                tokenService.getUserDetails().role === '1'
            "
            class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
                (click)="navigateToDeleteShops()">
                <div class="flex items-center">
                    <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
                        <i class="fa-solid fa-shop-slash" style="color: #4a90e2"></i>
                    </div>
                    <span class="ml-3">Deleted Shops</span>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
            </div>
        </div>

    </div>
</div>

                permissionService.hasPermission('View all deleted shops') ||
                tokenService.getUserDetails().role === '1'
            " -->
