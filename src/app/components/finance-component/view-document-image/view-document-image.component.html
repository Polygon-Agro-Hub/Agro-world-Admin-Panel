<div class="grid grid-cols-2 gap-8">
  <div>
    <h3
      class="text-center text-sm font-semibold mb-4 text-gray-900 dark:text-white"
    >
      {{ frontTitle }}
    </h3>
    <div
      class="relative border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 shadow-sm overflow-hidden"
    >
      <div
        class="w-full h-[400px] overflow-hidden flex items-center justify-center"
      >
        <img
          [src]="frontImageUrl"
          [alt]="frontTitle"
          [style.transform]="'scale(' + frontZoomLevel + ')'"
          [style.transform-origin]="'center center'"
          class="w-auto h-auto max-w-full max-h-full object-contain transition-transform duration-200 cursor-pointer"
          (error)="onImageError($event, 'front')"
          (click)="openModal(frontImageUrl, frontTitle)"
        />
      </div>
      <div class="absolute bottom-3 right-3 flex flex-col gap-2">
        <button
          (click)="zoomOut('front'); $event.stopPropagation()"
          class="bg-white dark:bg-gray-700 p-2.5 rounded-md shadow-md hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors border border-gray-200 dark:border-gray-600"
          type="button"
        >
          <i
            class="fa-solid fa-minus text-xs text-gray-700 dark:text-gray-300"
          ></i>
        </button>
        <button
          (click)="zoomIn('front'); $event.stopPropagation()"
          class="bg-white dark:bg-gray-700 p-2.5 rounded-md shadow-md hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors border border-gray-200 dark:border-gray-600"
          type="button"
        >
          <i
            class="fa-solid fa-plus text-xs text-gray-700 dark:text-gray-300"
          ></i>
        </button>
      </div>
    </div>
  </div>

  <div>
    <h3
      class="text-center text-sm font-semibold mb-4 text-gray-900 dark:text-white"
    >
      {{ backTitle }}
    </h3>
    <div
      class="relative border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 shadow-sm overflow-hidden"
    >
      <div
        class="w-full h-[400px] overflow-hidden flex items-center justify-center"
      >
        <img
          [src]="backImageUrl"
          [alt]="backTitle"
          [style.transform]="'scale(' + backZoomLevel + ')'"
          [style.transform-origin]="'center center'"
          class="w-auto h-auto max-w-full max-h-full object-contain transition-transform duration-200 cursor-pointer"
          (error)="onImageError($event, 'back')"
          (click)="openModal(backImageUrl, backTitle)"
        />
      </div>
      <div class="absolute bottom-3 right-3 flex flex-col gap-2">
        <button
          (click)="zoomOut('back'); $event.stopPropagation()"
          class="bg-white dark:bg-gray-700 p-2.5 rounded-md shadow-md hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors border border-gray-200 dark:border-gray-600"
          type="button"
        >
          <i
            class="fa-solid fa-minus text-xs text-gray-700 dark:text-gray-300"
          ></i>
        </button>
        <button
          (click)="zoomIn('back'); $event.stopPropagation()"
          class="bg-white dark:bg-gray-700 p-2.5 rounded-md shadow-md hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors border border-gray-200 dark:border-gray-600"
          type="button"
        >
          <i
            class="fa-solid fa-plus text-xs text-gray-700 dark:text-gray-300"
          ></i>
        </button>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="isModalOpen"
  class="fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div
    class="relative w-full h-full flex items-center justify-center"
    (click)="$event.stopPropagation()"
  >
    <button
      (click)="closeModal()"
      class="absolute top-4 right-4 bg-white dark:bg-gray-700 p-3 rounded-full shadow-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors z-10"
      type="button"
    >
      <i class="fa-solid fa-times text-xl text-gray-600 dark:text-gray-300"></i>
    </button>

    <div
      class="absolute top-4 left-4 bg-white dark:bg-gray-700 px-4 py-2 rounded shadow-lg z-10"
    >
      <h3 class="text-sm font-semibold text-gray-700 dark:text-gray-300">
        {{ modalTitle }}
      </h3>
    </div>

    <div class="absolute bottom-4 right-4 flex gap-2 z-10">
      <button
        (click)="modalZoomOut()"
        class="bg-white dark:bg-gray-700 p-3 rounded-full shadow-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors"
        type="button"
      >
        <i class="fa-solid fa-minus text-gray-600 dark:text-gray-300"></i>
      </button>
      <button
        (click)="resetModalZoom()"
        class="bg-white dark:bg-gray-700 px-4 py-3 rounded-full shadow-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors"
        type="button"
      >
        <span class="text-sm font-medium text-gray-600 dark:text-gray-300"
          >{{ (modalZoomLevel * 100).toFixed(0) }}%</span
        >
      </button>
      <button
        (click)="modalZoomIn()"
        class="bg-white dark:bg-gray-700 p-3 rounded-full shadow-lg hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors"
        type="button"
      >
        <i class="fa-solid fa-plus text-gray-600 dark:text-gray-300"></i>
      </button>
    </div>

    <div class="flex items-center justify-center max-w-full max-h-full p-16">
      <img
        [src]="modalImageUrl"
        [alt]="modalTitle"
        [style.transform]="'scale(' + modalZoomLevel + ')'"
        class="transition-transform duration-200 max-w-full max-h-full object-contain"
        (click)="$event.stopPropagation()"
      />
    </div>
  </div>
</div>
