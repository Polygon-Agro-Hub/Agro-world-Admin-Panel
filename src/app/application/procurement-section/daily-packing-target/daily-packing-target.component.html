<button (click)="back()" class="mb-5 text-textLight dark:text-textDark">
  <i class="fa-solid fa-arrow-left"></i> Back
</button>

<div class="flex w-full">
  <div
    class="flex flex-col w-[70%] bg-white dark:bg-tileBlack shadow-lg rounded-lg"
  >
    <div class="px-12 pt-5 pb-4 border-b border-gray-200 dark:border-[#4B555A]">
      <h2 class="text-[18px] font-semibold text-[#292929] dark:text-textDark">
        Update Daily Packing Target
      </h2>
    </div>

    <form class="flex items-center pt-5 pr-12 pl-12 pb-5">
      <!-- Target Value Input -->
      <div class="flex items-center w-full mr-2">
        <label
          for="new-target"
          class="text-[#292929] dark:text-textDark font-medium flex items-center justify-center align-middle w-40 mr-5"
          >Set New Target</label
        >
        <input
          type="number"
          id="new-target"
          placeholder="--Type New Target--"
          class="border border-gray-300 rounded-lg dark:border-[#AFAFAF] dark:bg-tileBlack dark:text-white px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full"
          [(ngModel)]="newTargetValue"
          name="newTargetValue"
          step="1"
          min="1"
          (keydown)="preventDecimalInput($event); blockFirstSpace($event)"
          (blur)="validateTargetInput()"
        />
      </div>

      <!-- Submit Button -->
      <div class="flex items-center ml-2">
        <button
          type="button"
          (click)="saveTarget()"
          [disabled]="!newTargetValue"
          [style.backgroundColor]="!newTargetValue ? '#C1C1C1' : ''"
          [ngClass]="{
            'hover:bg-blue-600 bg-blue-500': newTargetValue,
            'cursor-not-allowed': !newTargetValue,
          }"
          class="text-white px-6 py-2 rounded-lg transition duration-200 ease-in-out"
        >
          Save
        </button>
      </div>
    </form>
  </div>

  <div
    class="flex items-center justify-center w-[30%] ml-5 pt-5 pr-12 pl-12 pb-5 w-100 bg-white dark:bg-tileBlack shadow-lg rounded-lg"
  >
    <div class="flex flex-col items-center gap-3">
      <h4 class="text-[#292929] dark:text-textDark font-medium">
        Current Daily Target
      </h4>
      <div class="flex flex-col justify-center items-center">
        <p class="text-3xl font-bold dark:text-white text-[#292929]">
          {{ currentDailyTarget === 0 ? "-" : currentDailyTarget }}
        </p>
        <p class="text-[#292929] text-sm dark:text-textDark">Orders per day</p>
      </div>
    </div>
  </div>
</div>
