<button (click)="back()" class="mb-5 text-textLight dark:text-textDark">
  <i class="fa-solid fa-arrow-left"></i> Back
</button>

<form (ngSubmit)="onSubmit()">
  <!-- save button -->
  <div class="flex flex-row justify-between items-center mb-6 pr-4">
    <p class="text-lg text-textLight dark:text-textDark font-semibold">
      Edit Coupon
    </p>
    <div class="flex items-center">
      <button type="button" (click)="onCancel()"
        class="px-4 w-30 py-2 bg-[#74788D] border border-gray-300 rounded-md text-[#D3D3D3] focus:outline-none focus:ring-2 focus:ring-blue-500">
        Cancel
      </button>
      <button type="button" (click)="onSubmit()"
        class="bg-[#3980C0] text-white px-5 py-2 w-30 rounded-md mx-2 border border-[#3980C0] cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">
        Save
      </button>
    </div>
  </div>

  <div class="flex flex-row justify-between">
    <div class="bg-[#FFFFFF] dark:bg-tileBlack px-20 pt-12 pb-12 shadow-md rounded-md w-[60%] h-full">
      <div class="mb-8">
        <label class="text-[#534E4E] dark:text-textDark">Code *</label>
        <input type="text" id="code" name="code" [(ngModel)]="coupenObj.code" #codeInput="ngModel" required
          (input)="onCodeInput($event)"
          class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack" />
        <div *ngIf="codeInput.touched && codeInput.errors?.['required']" class="text-red-500 text-sm mt-1">
          Code is required.
        </div>
      </div>

      <div class="mb-8">
        <label class="text-[#534E4E] dark:text-textDark">Type *</label>
        <div class="flex items-center space-x-4 mt-3">
          <div class="flex items-center space-x-2" *ngIf="coupenObj.type === 'Percentage'">
            <!-- With Discount Radio Button -->
            <input class="w-5 h-5 cursor-pointer accent-[#0021F5]" type="radio" id="typePercentage" name="type"
              [value]="'Percentage'" [(ngModel)]="coupenObj.type" />
            <label for="typePercentage" class="block text-sm font-medium text-gray-700 dark:text-textDark">
              Percentage
            </label>
          </div>
          <div class="flex items-center space-x-2" *ngIf="coupenObj.type === 'Fixed Amount'">
            <input class="w-5 h-5 cursor-pointer accent-[#0021F5]" type="radio" id="typeFixedAmount" name="type"
              [value]="'Fixed Amount'" [(ngModel)]="coupenObj.type" />
            <label for="typeFixedAmount" class="block text-sm font-medium text-gray-700 dark:text-textDark">
              Fixed Amount
            </label>
          </div>

          <div class="flex items-center space-x-2" *ngIf="coupenObj.type === 'Free Delivery'">
            <input class="w-5 h-5 cursor-pointer accent-[#0021F5]" type="radio" id="typeFreeDelivery" name="type"
              [(ngModel)]="coupenObj.type" [value]="'Free Delivery'" />
            <label for="typeFreeDelivery" class="block text-sm font-medium text-gray-700 dark:text-textDark">
              Free Delivary
            </label>
          </div>
        </div>
      </div>

      <div *ngIf="coupenObj.type === 'Percentage'" class="mb-6">
        <label class="text-[#534E4E] dark:text-textDark">Discount Percentage *</label>
        <input type="number" id="percentage" name="percentage" [(ngModel)]="coupenObj.percentage"
          #percentageInput="ngModel" required min="1" max="99" maxlength="2"
          (input)="validateDecimalInput($event, 'percentage')" (change)="checkPrecentageValue(coupenObj.percentage)"
          (keydown)="preventNegative($event)"
          class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack" />
        <div *ngIf="percentageInput.touched && percentageInput.errors?.['required']" class="text-red-500 text-sm mt-1">
          Discount percentage is required.
        </div>
        <div class="text-red-500 text-sm mt-1">{{ checkPrecentageValueMessage }}</div>
      </div>

      <div *ngIf="coupenObj.type === 'Fixed Amount'" class="mb-6">
  <label class="text-[#534E4E] dark:text-textDark">Discount Amount *</label>
  <input type="number" id="fixDiscount" name="fixDiscount" [(ngModel)]="coupenObj.fixDiscount"
    (input)="validateDecimalInput($event, 'fixDiscount')" min="0"
    (change)="checkFixAmountValue(coupenObj.fixDiscount)" (keydown)="blockLeadingZero($event)"
    class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack" />
  <div class="text-red-500 text-sm mt-1">
    <div>{{ checkfixAmountValueMessage }}</div>
  </div>
</div>

      <div class="flex flex-row mb-6">
        <input type="checkbox" id="checkLimit" name="checkLimit" [(ngModel)]="coupenObj.checkLimit" [value]="true"
          (change)="onCheckLimitChange()"
          class="mr-6 ml-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack transform scale-150 cursor-pointer accent-[#0021F5]" />

        <label for="chekLimit" class="text-[#534E4E] dark:text-textDark">
          Set Price Limit (ex : This Coupon valid only for more than Rs.5000
          Orders)
        </label>
      </div>

      <div *ngIf="coupenObj.checkLimit" class="mb-6">
        <label class="text-[#534E4E] dark:text-textDark">Price Limit *</label>
        <input type="number" id="priceLimit" name="priceLimit" [(ngModel)]="coupenObj.priceLimit"
          #priceLimitInput="ngModel" required min="0" (input)="validateDecimalInput($event, 'priceLimit')"
          class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack" />
        <div *ngIf="priceLimitInput.touched && priceLimitInput.errors?.['required']" class="text-red-500 text-sm mt-1">
          Price limit is required.
        </div>
      </div>
    </div>

    <div class="flex flex-col justify-start px-6 w-[40%]">
      <div class="bg-[#FFFFFF] dark:bg-tileBlack rounded-lg shadow-lg px-12 py-8">
        <label class="text-[#000000] dark:text-textDark font-normal text-1xl">Status *</label>
        <div class="flex items-center space-x-2 my-5">
          <!-- With Discount Radio Button -->
          <input class="w-5 h-5 cursor-pointer accent-[#0021F5]" type="radio" id="status" name="status"
            [value]="'Enabled'" [(ngModel)]="coupenObj.status" />
          <label for="withDiscount" class="block text-sm font-medium text-gray-700 dark:text-textDark">
            Enabled
          </label>
        </div>

        <div class="flex items-center space-x-2 my-5">
          <input class="w-5 h-5 cursor-pointer accent-[#0021F5]" type="radio" id="status" name="status"
            [value]="'Disabled'" [(ngModel)]="coupenObj.status" />
          <label for="withDiscount" class="block text-sm font-medium text-gray-700 dark:text-textDark">
            Disabled
          </label>
        </div>
      </div>

      <div class="bg-[#FFFFFF] dark:bg-tileBlack rounded-lg shadow-lg px-12 py-8 mt-4">
        <label class="text-[#000000] dark:text-textDark font-normal text-1xl">Schedule</label>
        <p class="text-[#838383] dark:text-textDark text-sm mt-2 mb-5">
          Settings to limit the coupon expiration date.
        </p>

        <div class="mb-6">
  <label class="text-textLight dark:text-textDark font-medium">Start Date *</label>
  <div class="relative mt-2">
    <p-calendar id="startDate" name="startDate" [(ngModel)]="coupenObj.startDate" (onSelect)="checkStartDate()"
      placeholder="Start Date" [showIcon]="true" [showClear]="true" #startDateInput="ngModel" required
      [showButtonBar]="true" iconDisplay="input" [style]="{ width: '100%' }" 
      panelStyleClass="calendar-popup-small rounded-xl dark:bg-[#2d354d] dark:text-textDark dark:border-gray-600 
      [&_.p-datepicker-calendar_td_span:hover]:dark:bg-[#4a5568] 
      [&_.p-datepicker-calendar_td_span:hover]:dark:text-white
      [&_.p-datepicker-header]:dark:bg-[#2d354d] 
      [&_.p-datepicker-header]:dark:text-white
      [&_.p-datepicker-buttonbar]:dark:bg-[#2d354d]"
      inputStyleClass="block w-full p-2 cursor-pointer border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack pr-20"
      [appendTo]="'body'" dateFormat="yy-mm-dd" />
  </div>
  <div *ngIf="startDateInput.touched && startDateInput.errors?.['required']" class="text-red-500 text-sm mt-1">
    Start date is required.
  </div>
</div>

<div class="mb-6">
  <label class="text-textLight dark:text-textDark font-medium">Expire Date *</label>
  <div class="relative mt-2">
    <p-calendar id="endDate" name="endDate" [(ngModel)]="coupenObj.endDate" (onSelect)="checkExpireDate()"
      placeholder="Expire Date" [showIcon]="true" [showClear]="true" #endDateInput="ngModel" required
      [showButtonBar]="true" iconDisplay="input" [style]="{ width: '100%' }" 
      panelStyleClass="calendar-popup-small rounded-xl dark:bg-[#2d354d] dark:text-textDark dark:border-gray-600 
      [&_.p-datepicker-calendar_td_span:hover]:dark:bg-[#4a5568] 
      [&_.p-datepicker-calendar_td_span:hover]:dark:text-white
      [&_.p-datepicker-header]:dark:bg-[#2d354d] 
      [&_.p-datepicker-header]:dark:text-white
      [&_.p-datepicker-buttonbar]:dark:bg-[#2d354d]"
      inputStyleClass="block w-full cursor-pointer p-2 border border-gray-300 rounded-md text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack pr-20"
      [appendTo]="'body'" dateFormat="yy-mm-dd" [minDate]="DateConverter(coupenObj.startDate)" />
  </div>
  <div *ngIf="endDateInput.touched && endDateInput.errors?.['required']" class="text-red-500 text-sm mt-1">
    Expire date is required.
  </div>
</div>
      </div>
    </div>
  </div>
</form>
