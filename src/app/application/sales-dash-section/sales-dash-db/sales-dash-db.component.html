<section class="min-h-full bg-[#f4f5f7] py-4 max-[1100px]:py-3 max-[480px]:py-2 dark:bg-[#0b1725]" aria-label="Sales dashboard" [attr.aria-busy]="loading">
  <p *ngIf="loading" class="mb-3 text-sm text-slate-500 dark:text-slate-300" role="status">Loading dashboard...</p>
  <div *ngIf="error" class="mb-3 flex items-center gap-3 text-sm text-red-600 dark:text-red-400" role="alert">
    <p>Unable to load dashboard data.</p>
    <button type="button" class="rounded bg-teal-600 px-3 py-1 text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-600" (click)="loadDashboard()">Retry</button>
  </div>
  <div class="mb-[22px] grid grid-cols-6 gap-[23px] max-[1100px]:gap-[14px] max-[760px]:grid-cols-3 max-[480px]:grid-cols-2" aria-label="Buyer totals">
    <article *ngFor="let card of buyerCards" class="flex min-h-[77px] flex-col items-center justify-center rounded-[7px] px-1 py-[9px] text-white min-[1500px]:min-h-[90px]" [ngClass]="card.bgClass">
      <svg class="mb-[6px] h-[19px] w-[19px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2 1 7.5 12 13l11-5.5L12 2Zm-8.8 9L1 12.1l11 5.5 11-5.5-2.2-1.1L12 15.4 3.2 11Zm0 4.6L1 16.7l11 5.5 11-5.5-2.2-1.1L12 20l-8.8-4.4Z" />
      </svg>
      <h2 class="m-0 text-center text-[14px] font-[400] text-[#ffffff] leading-[15px]">{{ card.label }}</h2>
      <p class="m-0 mt-[2px] text-[16px] font-[800] leading-[17px] text-[#ffffff]" [attr.aria-label]="valueFor(card.key) === null ? 'Data unavailable' : null">{{ (valueFor(card.key) | number:'1.0-0') ?? '\u2014' }}</p>
    </article>
  </div>

  <div class="grid grid-cols-3 gap-x-[25px] gap-y-4 max-[1100px]:gap-x-4 max-[760px]:grid-cols-2 max-[480px]:grid-cols-1" aria-label="Sales and package totals">
    <article *ngFor="let card of summaryCards" class="relative flex min-h-[77px] items-center gap-[14px] rounded-lg border border-[#e5e7eb] bg-white px-[14px] py-[15px] min-[1500px]:min-h-[90px] max-[1100px]:gap-[10px] max-[1100px]:px-3 dark:border-[#263647] dark:bg-[#061e2c]">
      <span class="flex h-[41px] basis-[41px] shrink-0 grow-0 items-center justify-center rounded-full"
        [ngClass]="card.type === 'orders' ? 'bg-[#eff0ff] text-[#4c59ff] text-[21px]' : card.type === 'purchases' ? 'bg-[#ffedd6] text-[#ff9138] text-[18px]' : 'bg-[#c9faf1] text-[#009e90] text-[18px]'"
        aria-hidden="true"><i [class]="card.icon"></i></span>
      <div class="min-w-0" [ngClass]="card.type === 'orders' ? 'pb-[3px]' : 'pb-0'">
        <h2 class="m-0 mb-[3px] text-[14px] font-[500] text-[#4B5563] leading-[15px] text-[#445065] dark:text-[#e2e8f0]">{{ card.label }}</h2>
        <p class="m-0 text-[16px] font-[600] leading-[17px] text-[#000000] [overflow-wrap:anywhere] dark:text-[#e2e8f0]" [attr.aria-label]="card.value === null ? 'Data unavailable' : null">{{ formatValue(card) }}</p>
      </div>
      <p *ngIf="card.type === 'orders'" class="absolute right-[10px] bottom-[7px] m-0 text-[12px] leading-[12px] text-[#ABB0B8] font-[400]">{{ data?.periodLabel }}</p>
    </article>
  </div>
</section>
