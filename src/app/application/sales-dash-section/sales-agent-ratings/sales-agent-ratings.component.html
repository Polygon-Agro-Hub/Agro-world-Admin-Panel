<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

<button class="mb-5 text-textLight dark:text-textDark" (click)="goBack()">
    <i class="fa-solid fa-arrow-left"></i>
    Back
</button>

<div class="fixed-width-container">
    <div class="pt-5 pr-12 pl-12 pb-5 bg-tileLight dark:bg-tileBlack shadow-lg rounded-lg">
        <div class="w-full max-w-[920px]">
            <!-- Header -->
            <div class="flex justify-between items-center mb-8 mt-4 flex-wrap gap-4">
                <h2 class="text-xl font-semibold text-[#292929] dark:text-textDark">
                    Sales Agent Ratings
                </h2>

                <!-- Filters -->
                <div class="flex items-center">
                    <div class="mr-5">
                        <p-dropdown
                            styleClass="border border-2 rounded-xl h-8 items-center bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark border-[#E0E0E0] dark:border-[#AFAFAF]"
                            [options]="agentOptions" optionLabel="label" optionValue="value"
                            [showClear]="!!selectedAgent" placeholder="Agent" [(ngModel)]="selectedAgent"
                            (onChange)="agentFilter()"></p-dropdown>
                    </div>

                    <div class="flex items-center gap-2 h-8">
                        <p-calendar id="ratingDate" [(ngModel)]="date" (onSelect)="dateFilter()"
                            (onClear)="onDateClear()" dateFormat="yy/mm/dd" placeholder="Select Date" [showIcon]="true"
                            [showClear]="true" [readonlyInput]="true" iconDisplay="input"
                            [style]="{ width: '12rem', height: '2rem' }" panelStyleClass="calendar-popup-small rounded-xl dark:bg-[#2d354d] dark:text-textDark dark:border-gray-600
                                [&_.p-datepicker-calendar_td_span:hover]:dark:bg-[#4a5568]
                                [&_.p-datepicker-calendar_td_span:hover]:dark:text-white
                                [&_.p-datepicker-header]:dark:bg-[#2d354d]
                                [&_.p-datepicker-header]:dark:text-white
                                [&_.p-datepicker-buttonbar]:dark:bg-[#2d354d]
                                [&_.p-button:hover]:dark:bg-[#6b7280]"
                            inputStyleClass="p-2 border cursor-pointer rounded-xl bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark w-48 h-8 pr-12"
                            [appendTo]="'body'" />
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div
                class="overflow-x-auto scrollbar-thin scrollbar-thumb-scrollBarColor scrollbar-track-transparent scrollbar-thumb-rounded-full">
                <table class="min-w-full divide-y divide-gray-200 table-auto" *ngIf="hasData">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 font-normal text-sm text-[#5C5C5C] dark:text-textDark text-left"
                                style="white-space: nowrap">
                                Agent ID
                            </th>
                            <th class="px-4 py-3 font-normal text-sm text-[#5C5C5C] dark:text-textDark text-left"
                                style="white-space: nowrap">
                                Agent Name
                            </th>
                            <th class="px-4 py-3 font-normal text-sm text-[#5C5C5C] dark:text-textDark text-left"
                                style="white-space: nowrap">
                                Completion
                            </th>
                            <th class="px-4 py-3 font-normal text-sm text-[#5C5C5C] dark:text-textDark text-left"
                                style="white-space: nowrap">
                                Date
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let item of ratings" class="border-t border-[#EFEFEF] dark:border-gray-700">
                            <td
                                class="px-4 py-4 text-left whitespace-nowrap font-medium text-[#000000] dark:text-textDark">
                                {{ item.empId }}
                            </td>
                            <td class="px-4 py-4 text-left whitespace-nowrap text-[#000000] dark:text-textDark">
                                {{ item.name }}
                            </td>
                            <td class="px-4 py-4 text-left whitespace-nowrap text-[#000000] dark:text-textDark">
                                <span *ngIf="item.completed !== null && item.target !== null; else noCompletion">
                                    {{ item.completed }}/{{ item.target }}
                                </span>
                                <ng-template #noCompletion>--</ng-template>
                            </td>
                            <td class="px-4 py-4 text-left whitespace-nowrap text-[#000000] dark:text-textDark">
                                {{ formatDisplayDate(item.date) }}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- No data -->
        <div *ngIf="!hasData && !isLoading" class="flex flex-col items-center w-full px-10 py-7 mt-6">
            <p class="text-[#494949] my-6 dark:text-textDark">
                --No Data Available--
            </p>
            <img src="assets/images/NoData.png" alt="No Data" class="w-20 h-20" />
        </div>
    </div>
</div>
