<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<button onclick="history.back()" class="text-textLight dark:text-textDark">
    <i class="fa-solid fa-arrow-left"></i>
    Back
</button>
<div class="h-[20px]"></div>

<div class="mx-auto p-6 bg-white dark:bg-tileBlack rounded-lg shadow-mg gap-y-2">
    <h2 class="font-semibold dark:text-white">Assign Cities to Centre</h2>
    <div class="flex flex-row justify-between items-center gap-x-16 mt-4 px-10">
        <!-- Province Selector -->
        <div class="w-2/5">
            <label for="province"
                class="block mb-2 text-sm font-medium text-textLight dark:text-textDark">Province</label>
            <p-dropdown
                styleClass="border border-2 rounded-xl h-12 items-center bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark border-[#yourLightColor] dark:border-[#AFAFAF] w-full"
                id="province" [options]="provinces" [(ngModel)]="selectProvince" optionLabel="name"
                (onChange)="onProvinceChange()" placeholder="Choose a province" [filter]="false"
                [disabled]="!permissionService.hasPermission('Distribution Hub assign site') && tokenService.getUserDetails().role !== '1'"
                class="w-full">
                <ng-template pTemplate="selectedItem">
                    <div *ngIf="selectProvince" class="flex align-items-center">
                        <div>{{ selectProvince.name }}</div>
                    </div>
                </ng-template>
            </p-dropdown>
        </div>

        <!-- District Selector -->
        <div class="w-2/5">
            <label for="district"
                class="block mb-2 text-sm font-medium text-textLight dark:text-textDark">District</label>
            <p-dropdown
                styleClass="border border-2 rounded-xl h-12 items-center bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark border-[#yourLightColor] dark:border-[#AFAFAF] w-full"
                id="district" [options]="filteredDistricts" [(ngModel)]="selectDistrict" optionLabel="name"
                placeholder="Choose a district" (onChange)="selectStatusChange()"
                [disabled]="!selectProvince || filteredDistricts.length === 0 || (!permissionService.hasPermission('Distribution Hub assign site') && tokenService.getUserDetails().role !== '1')"
                [filter]="false" class="w-full">
                <ng-template pTemplate="selectedItem">
                    <div *ngIf="selectDistrict" class="flex align-items-center">
                        <div>{{ selectDistrict.name }}</div>
                    </div>
                </ng-template>
            </p-dropdown>
        </div>

        <div class="w-1/5 self-end">
            <button
                *ngIf="permissionService.hasPermission('Distribution Hub assign site') || tokenService.getUserDetails().role === '1'"
                (click)="fetchData()" class="bg-[#3980C0] text-white text-lg px-4 py-2 rounded-md"
                [disabled]="!selectProvince || !selectDistrict">
                Go
            </button>
        </div>
    </div>
</div>

<div class="h-[20px]"></div>

<div class="mx-auto p-6 bg-white dark:bg-tileBlack rounded-lg shadow-mg relative">
    <div *ngIf="hasData && citiesArr.length > 0 && centersArr.length > 0">
        <div class="relative isolate h-[60vh] max-h-[60vh] w-full min-w-0 overflow-auto scrollbar-thin scrollbar-thumb-[#FACD07] scrollbar-track-transparent scrollbar-thumb-rounded-full">
        <table class="min-w-max border-collapse divide-y divide-gray-200 dark:divide-[#4B555A] table-fixed">
            <colgroup>
                <col style="width: 240px" />
                <col *ngFor="let center of centersArr" style="width: 150px" />
            </colgroup>
            <thead class="sticky top-0 z-40 bg-white dark:bg-tileBlack">
                <tr class="bg-white dark:bg-tileBlack">
                    <th class="sticky left-0 z-50 box-border w-[240px] min-w-[240px] max-w-[240px] bg-white px-4 py-3 font-normal text-textLight dark:bg-tileBlack dark:text-textDark text-left shadow-[2px_0_0_0_#ffffff] dark:shadow-[2px_0_0_0_#272F45]"></th>
                    <th *ngFor="let center of centersArr"
                        class="px-4 py-3 font-normal text-textLight dark:text-textDark text-center whitespace-nowrap">
                        {{ center.regCode }}
                    </th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-300 dark:divide-[#4B555A]">
                <tr *ngFor="let city of citiesArr">
                    <td class="sticky left-0 z-30 box-border w-[240px] min-w-[240px] max-w-[240px] bg-white px-4 py-3 text-left text-textLight dark:bg-tileBlack dark:text-textDark whitespace-nowrap shadow-[2px_0_0_0_#ffffff] dark:shadow-[2px_0_0_0_#272F45]">
                        {{ city.city }}
                    </td>
                    <td *ngFor="let center of centersArr" class="px-4 py-3 text-center">
                        <label class="inline-flex items-center cursor-pointer">
                            <input type="checkbox" [checked]="isCityAssignedToCenter(city.id, center.id)"
                                (change)="toggleAssignment(city.id, center.id, $event)"
                                [disabled]="isToggleDisabled(city.id, center.id)" class="sr-only peer">
                            <div
                                class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600 dark:peer-checked:bg-blue-600">
                            </div>
                        </label>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>

    <div *ngIf="!selectDistrict || !selectProvince || !hasData"
        class="flex flex-col items-center w-full h-screen px-10 py-7 mt-6">
        <p class="text-[#494949] my-6 dark:text-textDark">--Please select the province and district first--</p>
        <img src="assets/images/NoData.png" alt="No Data" class="w-20 h-20" />
    </div>

    <!-- No Data Message -->
    <div *ngIf="hasData && (citiesArr.length === 0 || centersArr.length === 0)"
        class="flex flex-col items-center w-full h-screen px-10 py-7 mt-6">
        <p class="text-[#494949] my-6 dark:text-textDark">--No data available for the selected district--</p>
        <img src="assets/images/NoData.png" alt="No Data" class="w-20 h-20" />
    </div>
</div>
