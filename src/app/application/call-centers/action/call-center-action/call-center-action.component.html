<div class="flex justify-center items-center">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 lg:gap-16 mb-32">
    <div class="flex justify-center cursor-pointer">
      <div class="relative">
        <div
          (click)="toggleCallLogsMenu($event)"
          class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
        >
          <div class="flex items-center">
            <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
              <i class="fa-solid fa-headset" style="color: #4a90e2"></i>
            </div>
            <span class="ml-3">IVR Portal</span>
          </div>
          <i
            class="fa-solid fa-chevron-right transition-transform duration-200"
            style="color: #4a90e2"
          ></i>
        </div>

        <!-- Sub menu -->
        <div
          *ngIf="isCallLogsMenuOpen"
          class="absolute right-0 top-[58px] z-20 w-[220px] py-2 rounded-2xl bg-white dark:bg-tileBlack shadow-[0_8px_30px_rgb(0,0,0,0.18)]"
        >
          <div
            (click)="ivrCallSummary($event)"
            class="px-6 py-3 text-sm font-medium text-[#495057] dark:text-gray-200 hover:bg-tileHoverLight dark:hover:bg-tileHoverDark cursor-pointer"
          >
            IVR Call Summary
          </div>
          <div
            (click)="ivrLiveCallLog($event)"
            class="px-6 py-3 text-sm font-medium text-[#495057] dark:text-gray-200 hover:bg-tileHoverLight dark:hover:bg-tileHoverDark cursor-pointer"
          >
            IVR Live Call Log
          </div>
        </div>
      </div>
    </div>
