<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

<button (click)="back()" class="text-textLight dark:text-textDark">
    <i class="fa-solid fa-arrow-left"></i>
    Back
</button>
<div class="h-[20px]"></div>

<div
    class="w-full lg:w-3/4 min-h-[280px] p-6 bg-white dark:bg-tileBlack border border-[#e1e5ea] dark:border-gray-700 rounded-lg">
    <h2 class="text-[20px] font-medium mb-6 text-[#000000] dark:text-textDark">
        {{ isEditMode ? 'Edit Container' : 'Add Container' }}
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Container Label Name -->
        <div class="pb-2">
            <label for="containerLabel" class="block text-[16px] font-medium text-[#101C2B] dark:text-textDark">
                Container Label Name *
            </label>
            <input id="containerLabel" name="containerLabel" type="text" [(ngModel)]="containerData.labelName"
                maxlength="8" (blur)="onBlur('labelName')" (keydown)="handleInputWithSpaceTrimming($event, 'labelName')"
                placeholder="Enter Container label name (e.g. 50L / Sack)"
                class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-[#000000] dark:text-textDark bg-tileLight dark:bg-tileBlack"
                [ngClass]="{ 'border-red-500': isFieldInvalid('labelName') }" />
            <span *ngIf="isFieldInvalid('labelName')" class="text-red-500 text-sm">
                Container Label Name is required.
            </span>
        </div>

        <!-- Weight -->
        <div class="pb-2">
            <label for="containerWeight" class="block text-[16px] font-medium text-[#101C2B] dark:text-textDark">
                Weight (kg) *
            </label>
            <input id="containerWeight" name="containerWeight" type="text" inputmode="decimal"
                [(ngModel)]="containerData.weight" (blur)="onBlur('weight')" (keydown)="allowOnlyDecimal($event)"
                (input)="onWeightInput($event)" placeholder="e.g. 30"
                class="mt-1 block w-full p-2 border border-gray-300 rounded-md text-[#000000] dark:text-textDark bg-tileLight dark:bg-tileBlack"
                [ngClass]="{ 'border-red-500': isFieldInvalid('weight') || weightError }" />
            <span *ngIf="isFieldInvalid('weight') && !weightError" class="text-red-500 text-sm">
                Weight is required.
            </span>
            <span *ngIf="weightError" class="text-red-500 text-sm">
                {{ weightError }}
            </span>
        </div>
    </div>

    <div class="flex justify-end mt-10">
        <button type="button" (click)="onCancel()"
            class="px-6 py-3 bg-[#74788D] text-white rounded-md mr-3 hover:opacity-90 transition-opacity">
            Cancel
        </button>
        <button type="button" (click)="onSubmit()"
            class="px-6 py-3 bg-[#3980C0] text-white rounded-md hover:opacity-90 transition-opacity">
            {{ isEditMode ? 'Update Container' : 'Save Container' }}
        </button>
    </div>
</div>
