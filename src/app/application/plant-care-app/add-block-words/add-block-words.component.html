<div class="min-h-screen p-6">

  <!-- Back -->
  <button
    (click)="back()"
    class="text-textLight dark:text-textDark mb-6 flex items-center gap-2 underline"
  >
    <i class="fa-solid fa-arrow-left"></i>
    Back
  </button>

  <!-- Add New Block Word -->
  <div class="bg-tileLight dark:bg-tileBlack rounded-lg shadow-lg p-6 mb-6">
    <h2 class="text-base font-semibold text-textLight dark:text-textDark mb-4">
      Add New Block Word
    </h2>

    <div class="flex gap-4">
      <input
        type="text"
        [(ngModel)]="newBlockWord"
        (keyup.enter)="addBlockWord()"
        placeholder="Enter a word to block.."
        class="flex-grow px-4 py-2.5 border border-[#8E8E8E] rounded-md text-sm bg-tileLight dark:bg-tileBlack text-textLight dark:text-textDark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <button
        (click)="addBlockWord()"
        [disabled]="!newBlockWord.trim()"
        class="px-6 py-2.5 rounded-md text-sm font-medium transition-colors"
        [ngClass]="newBlockWord.trim()
          ? 'bg-blue-700 text-white hover:bg-blue-800'
          : 'bg-gray-200 dark:bg-gray-700 text-gray-400 dark:text-gray-500 cursor-not-allowed'"
      >
        Add Word
      </button>
    </div>
  </div>

  <!-- All Block Words -->
  <div class="bg-tileLight dark:bg-tileBlack rounded-lg shadow-lg p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-base font-semibold text-textLight dark:text-textDark">
        All Block Words ({{ blockWords.length }})
      </h3>
    </div>

    <div class="flex items-center justify-between gap-4 mb-6">
      <!-- Search -->
      <div class="relative w-full max-w-xs">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
          placeholder="Search Block Words.."
          class="w-full pl-4 pr-10 py-2 border border-[#8E8E8E] rounded-md text-sm bg-tileLight dark:bg-tileBlack text-textLight dark:text-textDark placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      </div>

      <!-- Sort -->
      <div class="relative">
        <button
          (click)="toggleSortMenu()"
          class="flex items-center gap-2 px-4 py-2 border border-[#8E8E8E] rounded-md text-sm text-textLight dark:text-textDark bg-tileLight dark:bg-tileBlack"
        >
          Sort : {{ sortOrder === 'asc' ? 'A - Z' : 'Z - A' }}
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>

        <div
          *ngIf="isSortMenuOpen"
          class="absolute right-0 mt-1 w-32 bg-tileLight dark:bg-tileBlack border border-[#8E8E8E] rounded-md shadow-md z-10"
        >
          <button
            (click)="setSortOrder('asc')"
            class="block w-full text-left px-4 py-2 text-sm text-textLight dark:text-textDark hover:bg-gray-50 dark:hover:bg-gray-700"
          >
            A - Z
          </button>
          <button
            (click)="setSortOrder('desc')"
            class="block w-full text-left px-4 py-2 text-sm text-textLight dark:text-textDark hover:bg-gray-50 dark:hover:bg-gray-700"
          >
            Z - A
          </button>
        </div>
      </div>
    </div>

    <!-- Word grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
      <div
        *ngFor="let word of pagedWords"
        class="flex items-center justify-between gap-2 px-4 py-2.5 border border-[#8E8E8E] rounded-md"
      >
        <span class="text-sm text-textLight dark:text-textDark truncate">{{ word }}</span>
        <button
          type="button"
          (click)="removeBlockWord(word)"
          class="flex-shrink-0 text-[#1B3358] dark:text-[#7CA9D8] hover:opacity-80"
          title="Remove word"
        >
          <i class="fa-solid fa-circle-xmark text-lg"></i>
        </button>
      </div>

      <div *ngIf="pagedWords.length === 0" class="col-span-full text-center text-sm text-gray-400 py-8">
        No block words found.
      </div>
    </div>

    <!-- Pagination -->
    <div
      class="border-t border-[#8E8E8E] mt-6 pt-4 flex justify-end items-center gap-2"
      *ngIf="totalPages > 1"
    >
      <button
        type="button"
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="w-8 h-8 flex items-center justify-center rounded-md border border-[#8E8E8E] text-textLight dark:text-textDark disabled:opacity-40"
      >
        <i class="fa-solid fa-chevron-left text-xs"></i>
      </button>

      <button
        type="button"
        *ngFor="let page of pageNumbers"
        (click)="goToPage(page)"
        class="w-8 h-8 flex items-center justify-center rounded-md text-sm font-medium"
        [ngClass]="page === currentPage
          ? 'bg-blue-700 text-white'
          : 'border border-[#8E8E8E] text-textLight dark:text-textDark hover:bg-gray-50 dark:hover:bg-gray-700'"
      >
        {{ page }}
      </button>

      <button
        type="button"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        class="w-8 h-8 flex items-center justify-center rounded-md border border-[#8E8E8E] text-textLight dark:text-textDark disabled:opacity-40"
      >
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>
  </div>

</div>
