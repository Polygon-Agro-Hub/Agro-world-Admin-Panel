<div class="rounded-2xl w-44 h-36 flex flex-col items-center justify-center gap-2 py-6 px-4"
     [ngStyle]="{ backgroundColor: config.bgColor }">
  <i [class]="config.iconClass + ' text-white text-3xl'"></i>
  <p class="text-white font-normal text-center">{{ config.label }}</p>
  <p class="text-white text-2xl font-bold">{{ config.count }}</p>
</div>
