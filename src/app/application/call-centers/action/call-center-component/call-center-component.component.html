<div class="flex items-center justify-center">
  <div class="w-screen h-screen flex justify-center items-center">
    <div
      class="relative overflow-hidden rounded-2xl"
      style="
        width: min(88vw, 320px);
        height: min(137.5vw, 500px);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      "
    >
      <div
        class="absolute top-0 left-0 right-0"
        style="
          height: 32%;
          background: linear-gradient(180deg, #191b1b 0%, #1e2323 100%);
        "
      ></div>

      <div
        class="absolute left-0 right-0 bottom-0"
        style="
          height: 68%;
          background: linear-gradient(
            180deg,
            #2e4040 0%,
            #2b3d3d 50%,
            #273838 100%
          );
        "
      ></div>

      <div
        class="absolute left-1/2"
        style="top: 32%; transform: translate(-50%, -50%); z-index: 20"
      >
        <div
          class="rounded-full bg-white overflow-hidden"
          style="
            width: min(30vw, 108px);
            height: min(30vw, 108px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
          "
        >
          <svg
            viewBox="0 0 100 100"
            xmlns="http://www.w3.org/2000/svg"
            style="width: 100%; height: 100%"
          >
            <rect width="100" height="100" fill="white" />
            <circle cx="50" cy="38" r="22" fill="#9EA3A3" />
            <ellipse cx="50" cy="90" rx="34" ry="26" fill="#9EA3A3" />
          </svg>
        </div>
      </div>

      <div
        class="absolute left-0 right-0 bottom-0 flex flex-col items-center justify-evenly"
        style="
          top: 32%;
          padding-top: min(10vw, 52px);
          padding-bottom: min(8vw, 36px);
        "
      >
        <p
          class="text-white font-normal m-0"
          style="font-size: clamp(15px, 4.5vw, 18px); letter-spacing: 0.2px"
        >
          Unknown
        </p>

        <!-- Number -->
        <p
          class="font-medium m-0"
          style="
            color: #29c6d4;
            font-size: clamp(13px, 4vw, 16px);
            letter-spacing: 0.3px;
          "
        >
          +94 77 11 22 555
        </p>

        <!-- Accept Button -->
        <div class="relative flex items-center justify-center">
          <!-- Ripple rings -->
          <div class="absolute rounded-full ripple ripple-1"></div>
          <div class="absolute rounded-full ripple ripple-2"></div>
          <div class="absolute rounded-full ripple ripple-3"></div>

          <!-- Button -->
          <button
            (click)="acceptCall()"
            class="relative z-10 rounded-full flex items-center justify-center border-0 cursor-pointer transition-transform duration-150 hover:scale-110 active:scale-95"
            style="
              width: min(15vw, 56px);
              height: min(15vw, 56px);
              background: linear-gradient(145deg, #42b8e8 0%, #1a9fd4 100%);
              box-shadow: 0 4px 16px rgba(26, 159, 212, 0.65);
            "
          >
            <svg
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
              style="width: min(7.5vw, 26px); height: min(7.5vw, 26px)"
            >
              <path
                d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"
                fill="white"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
