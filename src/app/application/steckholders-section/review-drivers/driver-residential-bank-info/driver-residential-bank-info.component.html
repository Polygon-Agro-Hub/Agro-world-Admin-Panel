<div class="flex flex-col gap-6 px-4 md:px-10 dark:text-textDark" *ngIf="residentialBankObj">
  <div *ngFor="let field of fields; let i = index" class="bg-[#F8F9FB] dark:bg-[#2A2A2A] rounded-xl p-4">
    <label class="block mb-2 text-sm text-[#4B5563] dark:text-[#C8C8C8]">
      {{ pad(i + 1) }}. {{ field.label }}
    </label>
    <div class="w-full bg-white dark:bg-tileBlack border border-[#E1E6F5] dark:border-gray-600 rounded-lg px-4 py-2 text-sm">
      {{ show(field.value) }}
    </div>
  </div>
</div>
