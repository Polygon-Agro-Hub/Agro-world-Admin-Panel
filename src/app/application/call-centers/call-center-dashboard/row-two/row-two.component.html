<div class="w-full space-y-6 text-gray-800">
  <!-- Metric cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    @for (c of metricCards; track c.label) {
      <div class="bg-white rounded-xl shadow-sm p-5 border-b-2 border-slate-100">
        <div class="flex items-start justify-between">
          <span class="text-sm font-semibold tracking-wide uppercase text-gray-700">{{ c.label }}</span>
          <i class="fa-solid text-gray-400" [class]="c.icon"></i>
        </div>
        <div class="mt-3 flex items-baseline gap-1">
          <span class="text-4xl font-bold">{{ c.value }}</span>
          <span class="text-[10px] text-gray-400">{{ c.unit }}</span>
        </div>
        <div class="mt-2 flex items-center gap-2 text-xs text-gray-600">
          <span class="w-2 h-2 rounded-full" [style.background]="c.dot"></span>{{ c.note }}
        </div>
      </div>
    }
  </div>

  <!-- Summary cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
    @for (c of summaryCards; track c.label) {
      <div class="bg-white rounded-xl shadow-sm overflow-hidden flex flex-col">
        <div class="p-5 flex-1">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0"
              [style.background]="c.iconBg" [style.color]="c.iconColor">
              <i class="fa-solid" [class]="c.icon"></i>
            </div>
            <div>
              <div class="text-sm font-semibold tracking-wide uppercase text-gray-700">{{ c.label }}</div>
              <div class="text-4xl font-bold mt-1">{{ c.value }}</div>
              <div class="text-xs text-gray-500 mt-1">{{ c.description }}</div>
            </div>
          </div>
          <div class="flex items-center justify-between mt-6 text-[10px]">
            <span class="text-gray-400">{{ c.footerLeft }}</span>
            <span class="font-semibold" [style.color]="c.footerRightColor">{{ c.footerRight }}</span>
          </div>
        </div>
        <div class="h-1.5" [style.background]="c.accent"></div>
      </div>
    }
  </div>
</div>
