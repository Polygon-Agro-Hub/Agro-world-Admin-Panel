<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
<button class="mb-5 text-textLight dark:text-textDark" (click)="Back()">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</button>
<div
  class="fixed-width-container overflow-x-auto scrollbar-thin scrollbar-thumb-scrollBarColor scrollbar-track-transparent scrollbar-thumb-rounded-full"
>
  <div
    class="pt-5 pr-12 pl-12 pb-5 w-full bg-tileLight dark:bg-tileBlack shadow-lg rounded-lg overflow-x-auto scrollbar-thin scrollbar-thumb-scrollBarColor scrollbar-track-transparent scrollbar-thumb-rounded-full"
  >
    <div class="flex justify-between items-center mb-8">
      <div class="flex items-center">
        <h2 class="text-2xl font-normal text-textLight dark:text-textDark">
          Project Investments ({{ totalCount | number: "2.0" }})
        </h2>
      </div>

      <div>
        <div
          class="flex items-center rounded-full px-4 py-2 w-96 bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark"
        >
          <input
            type="text"
            placeholder="Search By ID, Crop, Phone Number.."
            class="bg-transparent outline-none w-full text-textLight dark:text-textDark"
            [(ngModel)]="searchTerm"
            (keyup.enter)="filterProjects()"
          />

          <button
            type="button"
            class="text-gray-500 hover:text-gray-700 focus:outline-none mr-2"
            (click)="filterProjects()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 10-14 0 7 7 0 0014 0z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="text-gray-500 hover:text-gray-700 focus:outline-none"
            (click)="clearSearch()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div
      *ngIf="hasData"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
    >
      <div
        *ngFor="let project of filteredProjects"
        class="bg-white dark:bg-[#505974] rounded-lg shadow-md overflow-hidden border border-gray-200 dark:border-gray-700"
      >
        <div
          class="border-b border-gray-200 dark:border-gray-700 cursor-pointer"
          (click)="
            (permissionService.hasPermission(
              'View each investment transaction'
            ) ||
              tokenService.getUserDetails().role === '1') &&
              viewDetails(project.id)
          "
        >
          <div class="flex justify-center items-center p-5 h-48">
            <div
              class="relative w-full h-full flex justify-center items-center"
            >
              <div
                *ngIf="project.imageLoading"
                class="absolute inset-0 flex justify-center items-center"
              >
                <div
                  class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0B6BFE]"
                ></div>
              </div>

              <img
                *ngIf="!project.imageLoading && project.imageDataUrl"
                [src]="project.imageDataUrl || defaultImage"
                [alt]="project.cropNameEnglish"
                class="max-w-full max-h-full object-contain rounded"
                (error)="project.imageDataUrl = defaultImage"
              />

              <img
                *ngIf="!project.imageLoading && !project.imageDataUrl"
                [src]="defaultImage"
                [alt]="project.cropNameEnglish"
                class="max-w-full max-h-full object-contain rounded opacity-50"
              />
            </div>
          </div>

          <div class="flex flex-col justify-center items-center px-4">
            <h3 class="text-lg font-medium text-textLight dark:text-white">
              {{ project.cropNameEnglish }}
            </h3>
            <p class="text-gray-500 dark:text-white mt-1 mb-3">
              {{ project.jobId }}
            </p>
            <div class="flex items-center my-1">
              <span class="text-[#668EC9] dark:text-white mr-1">Invested:</span>
              <span class="font-medium text-[#668EC9] dark:text-white"
                >{{ project.investedPercentage }}%</span
              >
            </div>
          </div>
          <div class="px-4 pb-2">
            <div class="w-full bg-gray-200 rounded-full h-2.5">
              <div
                class="bg-[#0B6BFE] h-2.5 rounded-full"
                [style.width.%]="project.investedPercentage"
              ></div>
            </div>
          </div>
        </div>
        <div class="space-y-2 flex justify-center py-2">
          <div class="flex items-center">
            <i class="fa-solid fa-phone mr-2 text-sm"></i>
            <span class="text-sm text-textLight dark:text-white">
              {{
                project.phoneNumber.substring(0, 3) +
                  " " +
                  project.phoneNumber.substring(3)
              }}
            </span>
          </div>
        </div>
      </div>
    </div>

    <div
      *ngIf="!hasData"
      class="flex flex-col items-center w-full h-screen px-10 py-7 bg-tileLight dark:bg-tileBlack dark:text-textDark mt-6"
    >
      <p class="text-[#494949] my-6 dark:text-textDark">
        --No Data Availabale--
      </p>
      <img
        src="assets/images/NoData.png"
        alt="No Data"
        class="w-20 h-20 dark:text-textDark"
      />
    </div>
  </div>
</div>
