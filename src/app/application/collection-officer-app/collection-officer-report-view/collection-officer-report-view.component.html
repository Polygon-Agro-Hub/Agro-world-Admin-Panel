<app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

<button class="mb-5 text-textLight dark:text-textDark" (click)="back()">
  <i class="fa-solid fa-arrow-left"></i>
  Back
</button>

<div
  class="fixed-width-container overflow-x-auto scrollbar-thin scrollbar-thumb-scrollBarColor scrollbar-track-transparent scrollbar-thumb-rounded-full">

  <div class="min-w-[1100px] bg-white dark:bg-tileBlack rounded-lg shadow-lg mx-2 mb-4 mt-4">

    <div class="flex flex-row justify-end items-center mb-8 mt-4 mr-4 ">

      <div class="flex flex-row mt-4 mr-2">
        <i class="mr-6 w-6 mt-1 h-6 fill-current text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path
              d="M0 416c0 17.7 14.3 32 32 32l54.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 448c17.7 0 32-14.3 32-32s-14.3-32-32-32l-246.7 0c-12.3-28.3-40.5-48-73.3-48s-61 19.7-73.3 48L32 384c-17.7 0-32 14.3-32 32zm128 0a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zM320 256a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm32-80c-32.8 0-61 19.7-73.3 48L32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l246.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48l54.7 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-54.7 0c-12.3-28.3-40.5-48-73.3-48zM192 128a32 32 0 1 1 0-64 32 32 0 1 1 0 64zm73.3-64C253 35.7 224.8 16 192 16s-61 19.7-73.3 48L32 64C14.3 64 0 78.3 0 96s14.3 32 32 32l86.7 0c12.3 28.3 40.5 48 73.3 48s61-19.7 73.3-48L480 128c17.7 0 32-14.3 32-32s-14.3-32-32-32L265.3 64z" />
          </svg>
        </i>
        <div class="">
          <p-calendar id="fromDate" placeholder="YYYY/MM/DD" [showIcon]="true" [showClear]="false"
            [(ngModel)]="createdDate" name="createdDate" (onSelect)="fetchReport()" [showButtonBar]="true"
            iconDisplay="input" [style]="{ width: '18rem', height: '2rem' }" panelStyleClass="calendar-popup-small rounded-xl dark:bg-[#2d354d] dark:text-textDark dark:border-gray-600 
                     [&_.p-datepicker-calendar_td_span:hover]:dark:bg-[#4a5568] 
                     [&_.p-datepicker-calendar_td_span:hover]:dark:text-white
                     [&_.p-datepicker-header]:dark:bg-[#2d354d] 
                     [&_.p-datepicker-header]:dark:text-white
                     [&_.p-datepicker-buttonbar]:dark:bg-[#2d354d]
                     [&_.p-button:hover]:dark:bg-[#6b7280]"
            inputStyleClass="p-2 border cursor-pointer rounded-xl bg-[#F1F1F1] dark:bg-[#272F45] text-textLight dark:text-textDark w-[25rem] h-8 pr-12" />
        </div>
      </div>
    </div>

    <div class="flex flex-col items-center mb-6">
      <h2 class="text-2xl font-normal text-textLight dark:text-textDark">{{name}} {{lastName}}</h2>
      <h2 class="text-2xl font-normal text-textLight dark:text-textDark">{{createdDate | date: 'yyyy/MM/dd' }}</h2>
    </div>

    <div *ngIf="!hasData" class="flex flex-col items-center w-full h-screen px-10 py-7 mt-6">
      <p class="text-[#494949] my-6 dark:text-textDark">
        --No Data Available--
      </p>
      <img src="assets/images/NoData.png" alt="No Data" class="w-20 h-20" />
    </div>

    <div *ngIf="hasData">
      <div [style.display]="'block'" class="pt-16 pb-10 px-6" style="height: 500px;">
        <canvas id="reportBarChart"></canvas>
      </div>

      <div class="mx-6">
        <table class="table-auto border-collapse w-full">
          <thead>
            <tr>
              <th class="border border-gray-300 px-4 py-2 text-textLight dark:text-textDark">Crop Variety</th>
              <th class="border border-gray-300 px-4 py-2 text-textLight dark:text-textDark">Grade A</th>
              <th class="border border-gray-300 px-4 py-2 text-textLight dark:text-textDark">Grade B</th>
              <th class="border border-gray-300 px-4 py-2 text-textLight dark:text-textDark">Grade C</th>
              <th class="border border-gray-300 px-4 py-2 text-textLight dark:text-textDark">Total</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let entry of reportData | keyvalue">
              <td class="border border-gray-300 p-2 text-textLight dark:text-textDark">
                {{ entry.key }}
              </td>

              <td class="border border-gray-300 p-2 text-textLight dark:text-textDark">
                {{ entry.value['Grade A'] }}kg
              </td>

              <td class="border border-gray-300 p-2 text-textLight dark:text-textDark">
                {{ entry.value['Grade B'] }}kg
              </td>

              <td class="border border-gray-300 p-2 text-textLight dark:text-textDark">
                {{ entry.value['Grade C'] }}kg
              </td>

              <td class="border border-gray-300 p-2 text-textLight dark:text-textDark">
                {{ entry.value['Total'] }}kg
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="h-[25px]"></div>

      <div class="flex mb-8 justify-center min-w-[1100px]">
        <button (click)="downloadPDF()" class="bg-[#3980C0] hover:bg-[#2b6293] text-white font-bold py-2 px-4 rounded"
          [disabled]="isDownloading">
          <i class="fas fa-download" *ngIf="!isDownloading"></i>
          <i class="fas fa-spinner fa-spin" *ngIf="isDownloading"></i>
          {{ isDownloading ? ' Downloading...' : ' Download PDF' }}
        </button>
      </div>
      <div class="h-[25px] min-w-[1100px]"></div>
    </div>

  </div>


</div>
