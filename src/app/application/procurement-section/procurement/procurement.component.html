<div class="flex justify-center items-center">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 lg:gap-16">
    <div (click)="definePackages()" class="flex justify-center cursor-pointer"
      *ngIf="permissionService.hasPermission('Procurement dispatch packages') || tokenService.getUserDetails().role === '1'">
      <div
        class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500">
        <div class="flex items-center">
          <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
            <i class="fa fa-folder-open-o" style="color: #4a90e2"></i>
          </div>
          <span class="ml-3">Dispatch Packages</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
      </div>
    </div>

    <div (click)="purchaseReport()" class="flex justify-center cursor-pointer"
      *ngIf="permissionService.hasPermission('Procurement received orders') || tokenService.getUserDetails().role === '1'">
      <div
        class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500">
        <div class="flex items-center">
          <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
            <i class="fa fa-folder-open-o" style="color: #4a90e2"></i>
          </div>
          <span class="ml-3">Received Orders</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
      </div>
    </div>

    <div (click)="viewCenterRequirement()" class="flex justify-center cursor-pointer"
      *ngIf="permissionService.hasPermission('Procurement centre requirement') || tokenService.getUserDetails().role === '1'">
      <div
        class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500">
        <div class="flex items-center">
          <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
            <i class="fa fa-folder-open-o" style="color: #4a90e2"></i>
          </div>
          <span class="ml-3">Centre Requirements</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
      </div>
    </div>

   <div
    class="transition-shadow hover:shadow-[0_8px_30px_rgb(0,0,0,0.12)] dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] hover:bg-tileHoverLight inline-flex items-center justify-between w-[310px] h-[70px] px-4 py-2 text-sm font-medium text-[#495057] bg-tileLight dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500 cursor-pointer"
    (click)="togglePopupProductStorage()"
    >
    <div class="flex items-center">
      <div class="bg-iconCoverLight dark:bg-iconCoverDark rounded-lg p-3">
        <i class="fa-solid fa-question" style="color: #4a90e2"></i>
      </div>
      <span class="ml-3">Product Shortage</span>
    </div>
    <i class="fa-solid fa-chevron-right" style="color: #4a90e2"></i>
  </div>
  <div
    class="mt-48 rounded-lg shadow-[0_3px_10px_rgb(0,0,0,0.2)] bg-white w-[310px] min-h-max absolute dark:bg-tileBlack dark:hover:bg-tileHoverDark dark:text-gray-200 group-hover:drop-shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-100 focus:ring-indigo-500 dark:focus:ring-offset-gray-800 dark:focus:ring-gray-500"
    *ngIf="istogglePopupProductStorageView">
    <div *ngIf="permissionService.hasPermission('Add product') || tokenService.getUserDetails().role === '1'"
      class="flex rounded-t-lg align-middle items-center dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer"
      (click)="navigatePath('/procurement/view-shortage-today')">
      Shortage Today
    </div>

    <hr />
    <div *ngIf="permissionService.hasPermission('Add packages') || tokenService.getUserDetails().role === '1'"
      class="flex align-middle items-center dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer"
      (click)="navigatePath('/procurement/view-shortage-finalization-today')"
      >
      Shortage Finalization Today
    </div>
    <hr />
    <div *ngIf="permissionService.hasPermission('View product type') || tokenService.getUserDetails().role === '1'"
      class="flex rounded-b-lg align-middle items-center dark:hover:shadow-[0_8px_30px_rgb(147,178,189,0.12)] dark:bg-iconCoverDark dark:hover:bg-tileHoverDark hover:bg-tileHoverLight px-4 py-2 cursor-pointer"
      (click)="navigatePath('/procurement/procurement-shortage-history')"
      >
      Shortage History
    </div>
</div>
  </div>
</div>



<!-- onclick="window.location.href='reports/payment-slip-report/:id'" -->
<div class="flex justify-center items-center py-10">
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8 lg:gap-16"></div>
</div>
